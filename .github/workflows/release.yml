name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash build.sh
      - name: Checksums
        run: cd dist && sha256sum server-tools.sh > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/server-tools.sh dist/SHA256SUMS \
            --title "ServerTools ${GITHUB_REF_NAME}" \
            --generate-notes
