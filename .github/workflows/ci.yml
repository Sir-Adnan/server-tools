name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Build
        run: ./build.sh
      - name: ShellCheck
        run: shellcheck dist/server-tools.sh build.sh tests/smoke.sh
      - name: shfmt (formatting check)
        run: shfmt -i 2 -ci -d src build.sh tests

  smoke:
    name: Smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:11"
          - "debian:12"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (no root paths)
        run: bash tests/smoke.sh
      - name: Boot as root (--status)
        run: bash dist/server-tools.sh --status --no-color
